# included in every location that sets its own add_header: nginx drops the inherited ones otherwise
# copied to /etc/nginx/conf.d/security-headers.inc, interpolate-variables.sh fills in the
# ${CSP_*} origins when the container starts (one image serves every environment)
# a new external origin (api, cdn, tracker...) must be added to the CSP below, or it is blocked

add_header  Referrer-Policy "no-referrer" always;
add_header  Permissions-Policy "accelerometer=(), autoplay=(), camera=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
add_header  X-Content-Type-Options "nosniff" always;
add_header  X-Frame-Options "SAMEORIGIN" always;
add_header  Strict-Transport-Security "max-age=31536000" always;

# script-src: theconversation content tracker (utils/metrics.ts), which loads the counter as a <script>
# style-src: bulma cdn; 'unsafe-inline' for style attributes kept by the markdown sanitizer
# connect-src: api, keycloak, sdg classifier, terms (until WL-014), mixpanel
# frame-src / form-action: keycloak check-sso iframe and its post logout form
# worker-src: mixpanel session replay
add_header  Content-Security-Policy "default-src 'self'; script-src 'self' https://theconversation.com https://counter.theconversation.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ${CSP_API_ORIGIN} ${CSP_KEYCLOAK_ORIGIN} https://aurora-sdg.labs.vu.nl https://raw.githubusercontent.com https://api-eu.mixpanel.com; frame-src 'self' ${CSP_KEYCLOAK_ORIGIN}; worker-src 'self' blob: data:; form-action 'self' ${CSP_KEYCLOAK_ORIGIN}; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
