name: WeLearn
run-name: ${{ github.actor }} is testing WeLearn 🚀
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
      - '!**_deploy'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the image is only built and pushed once every check passed
  build-docker:
    needs: lint-and-test
    uses: CyberCRI/github-workflows/.github/workflows/build-push.yaml@f87dd5976f04baac2c649172f6e8acdf4d47c447 # main @ 2025-11-07
    with:
      registry-name: ${{ vars.DOCKER_PROD_REGISTRY }}
      image-name: welearn-client
      image-tag: ${{ github.sha }}
      recursive-submodule-checkout: true
      build-args: |
        VITE_API_BASE=$DOCKER_INJECT_VITE_API_BASE
        VITE_ENVIRONMENT=$DOCKER_INJECT_VITE_ENVIRONMENT
        VITE_WL_API_KEY=$DOCKER_INJECT_VITE_WL_API_KEY
        VITE_MIXPANEL_TOKEN=$DOCKER_INJECT_VITE_MIXPANEL_TOKEN
        VITE_KEYCLOAK_URL=$DOCKER_INJECT_VITE_KEYCLOAK_URL
        VITE_KEYCLOAK_REALM=$DOCKER_INJECT_VITE_KEYCLOAK_REALM
        VITE_KEYCLOAK_CLIENT_ID=$DOCKER_INJECT_VITE_KEYCLOAK_CLIENT_ID
    secrets:
      registry-username: ${{ secrets.DOCKER_PROD_USERNAME }}
      registry-password: ${{ secrets.DOCKER_PROD_PASSWORD }}
      submodules-app-id: ${{ secrets.INFRA_BOT_APP_ID }}
      submodules-app-installation-id: ${{ secrets.INFRA_BOT_APP_INSTALLATION_ID }}
      submodules-app-private-key: ${{ secrets.INFRA_BOT_APP_PRIVATE_KEY }}

  lint-and-test:
    timeout-minutes: 60
    runs-on: wlc-lint-and-test-runner
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # corepack ships with node and provides the yarn pinned in package.json's packageManager
      - name: Enable corepack
        run: corepack enable

      # setup-node's own yarn cache needs yarn before it runs, so the cache is set up here
      - name: Locate the yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        id: install
        run: yarn install --frozen-lockfile

      # every check below runs even when an earlier one failed, so one run reports them all
      - name: Run linter
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn lint:check

      - name: Run formatter check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn format:check

      - name: Run type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn type-check

      - name: Run unit tests with coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn test:coverage
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      # the API types in src/types/generated come from the API's committed openapi.json:
      # fail when they no longer match the API's main branch
      - name: Check generated API types are up to date
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://raw.githubusercontent.com/CyberCRI/WeLearn-api/main/openapi.json)
          if [ "$status" = "404" ]; then
            echo "No openapi.json on WeLearn-api main yet, skipping."
            exit 0
          fi
          yarn gen:api
          git diff --exit-code src/types/generated || {
            echo "::error::src/types/generated is out of date with WeLearn-api main, run 'yarn gen:api' and fix the type errors"
            exit 1
          }

      # the e2e projects only use chromium. the browser is cached per playwright version,
      # its system libraries are not, so they are installed on every run
      - name: Get the Playwright version
        id: playwright
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: echo "version=$(yarn -s playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: yarn playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: yarn playwright install-deps chromium
      - name: Run Playwright tests
        id: e2e
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # report only: production dependencies with high or critical advisories.
      # ponytail: non-blocking until the current advisories are fixed, then drop continue-on-error
      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: yarn audit --groups dependencies --level high

  tag-deploy:
    needs:
      - lint-and-test
      - build-docker
    uses: CyberCRI/github-workflows/.github/workflows/tag-deploy.yaml@f87dd5976f04baac2c649172f6e8acdf4d47c447 # main @ 2025-11-07
